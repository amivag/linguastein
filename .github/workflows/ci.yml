name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # With coverage, so the floors in vite.config.ts are enforced rather than
      # merely recorded. Same command `npm run check` runs locally.
      - name: Test
        run: npm run test:coverage

      - name: Validate datasets
        run: npm run validate:data

      # The whole tree, not just public/packs: the build also writes assigned
      # item ids back into content/es, so a row committed without one would
      # otherwise slip through unnoticed.
      - name: Datasets match their sources
        run: |
          npm run build:data
          git diff --exit-code

      - name: Build
        run: npm run build
