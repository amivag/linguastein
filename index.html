<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <!--
      GitHub Pages cannot set response headers, so the crawler and training
      opt-outs live here and in public/robots.txt instead of in an `X-Robots-Tag`.
      Advisory either way: honoured only by crawlers that choose to.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Mobile-first Spanish practice: listen, repeat, reveal, review."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>%APP_NAME% — %APP_TAGLINE%</title>
    <script>
      /*
        Resolve appearance before first paint, so neither colour nor type size
        flashes.

        The axes are *injected*: `%APPEARANCE_AXES%` is replaced from
        `src/styles/axes.ts` at build and dev time, the same way `%APP_ID%` comes
        from `src/app/identity.ts`. This script used to repeat every axis's values
        as literal arrays with a test comparing the two lists, which is a guard
        around a duplication that did not need to exist. Adding an axis now needs
        no edit here.

        Deliberately ES5 and dependency-free: it runs before any module loads, and
        a syntax error in it is a blank page.
      */
      (function () {
        var root = document.documentElement;
        var axes = %APPEARANCE_AXES%;

        // Each axis falls back to its default rather than aborting the rest: one
        // unreadable key must not leave the page unthemed.
        function stored(axis) {
          try {
            var value = localStorage.getItem('%APP_ID%.' + axis.key);
            return axis.values.indexOf(value) >= 0 ? value : axis.fallback;
          } catch (error) {
            return axis.fallback;
          }
        }

        for (var i = 0; i < axes.length; i += 1) {
          var axis = axes[i];
          var value = stored(axis);
          /*
            One axis stores a preference rather than a value: `system` is not a
            theme, so what the root carries is always a resolved light or dark.
            Flagged in the registry rather than matched on the axis name, so the
            script never has to know which axis is which.
          */
          if (axis.system && value === 'system') {
            var dark = true;
            try {
              dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (error) {
              dark = true;
            }
            value = dark ? 'dark' : 'light';
          }
          root.dataset[axis.dataset] = value;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
