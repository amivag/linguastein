name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # With coverage, so the floors in vite.config.ts are enforced rather than
      # merely recorded. Same command `npm run check` runs locally.
      - name: Test
        run: npm run test:coverage

      - name: Validate datasets
        run: npm run validate:data

      # Last of the correctness steps, deliberately.
      #
      # A failed step skips the ones after it. This sat third for a while, so
      # fourteen commits reached main with the formatting red and their tests and
      # datasets never checked by CI at all — a whitespace disagreement masking
      # everything that actually matters. `npm run check` runs the same steps and
      # now includes this one, so the drift should not recur; the order is the
      # cheap insurance if it does.
      - name: Format check
        run: npm run format:check

      # The whole tree, not just public/packs: the build also writes assigned
      # item ids back into content/es, so a row committed without one would
      # otherwise slip through unnoticed.
      - name: Datasets match their sources
        run: |
          npm run build:data
          git diff --exit-code

      - name: Build
        run: npm run build
