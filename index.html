<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <!--
      GitHub Pages cannot set response headers, so the crawler and training
      opt-outs live here and in public/robots.txt instead of in an `X-Robots-Tag`.
      Advisory either way: honoured only by crawlers that choose to.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Mobile-first Spanish practice: listen, repeat, reveal, review."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>%APP_NAME% — %APP_TAGLINE%</title>
    <script>
      // Resolve appearance before first paint, so neither colour nor type size
      // flashes. `%APP_ID%` is substituted from src/app/identity.ts, so these
      // cache keys cannot drift from the application identity.
      (function () {
        try {
          var stored = localStorage.getItem('%APP_ID%.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var readingSize = localStorage.getItem('%APP_ID%.reading-size') || 'small';
          document.documentElement.dataset.readingSize = /^(small|medium|large)$/.test(readingSize)
            ? readingSize
            : 'small';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.readingSize = 'small';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
