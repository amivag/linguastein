name: Deploy

# Publishes the built app to GitHub Pages. `Source: GitHub Actions` in the
# repository's Pages settings is what makes this work — and what makes it safe:
# Pages then serves only the artifact uploaded here, never the repository tree.
# Serving the tree is what put raw TypeScript on the web the first time round.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job asks for what it needs.
permissions: {}

# Newest push wins; a queued deploy of an older commit is not worth waiting for.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to commit SHAs rather than tags, because a tag can be moved
# to different code. Dependabot keeps the pins and the version comments current.

jobs:
  # Installs dependencies and runs their code, so it holds no write permission.
  # A compromised package can fail this job, but it cannot publish the site.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --engine-strict

      # Deliberately the full gate, not just the build. This duplicates ci.yml on
      # a push to main, which is cheap next to publishing a broken app: nothing
      # else stands between a bad commit and the live site.
      - name: Check
        run: npm run check

      # `tsc -b` runs inside this, and the checkout is a real git clone, so
      # vite.config.ts resolves the build commit on its own.
      - name: Build
        run: npm run build

      # Pages has no rewrite rule, so a hard refresh on /practice would 404.
      # Serving the app shell as the 404 body lets the router take over.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Holds the publishing permissions, and runs no repository or package code.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
