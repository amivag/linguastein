name: Deploy

# Publishes the built app to GitHub Pages. `Source: GitHub Actions` in the
# repository's Pages settings is what makes this work — and what makes it safe:
# Pages then serves only the artifact uploaded here, never the repository tree.
# Serving the tree is what put raw TypeScript on the web the first time round.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newest push wins; a queued deploy of an older commit is not worth waiting for.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Deliberately the full gate, not just the build. This duplicates ci.yml on
      # a push to main, which is cheap next to publishing a broken app: nothing
      # else stands between a bad commit and the live site.
      - name: Check
        run: npm run check

      # `tsc -b` runs inside this, and the checkout is a real git clone, so
      # vite.config.ts resolves the build commit on its own.
      - name: Build
        run: npm run build

      # Pages has no rewrite rule, so a hard refresh on /practice would 404.
      # Serving the app shell as the 404 body lets the router take over.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
