name: Deploy

# Publishes the built app to GitHub Pages. `Source: GitHub Actions` in the
# repository's Pages settings is what makes this work — and what makes it safe:
# Pages then serves only the artifact uploaded here, never the repository tree.
# Serving the tree is what put raw TypeScript on the web the first time round.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default. Each job asks for what it needs.
permissions: {}

# Newest push wins; a queued deploy of an older commit is not worth waiting for.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to commit SHAs rather than tags, because a tag can be moved
# to different code. Dependabot keeps the pins and the version comments current.

jobs:
  # Installs dependencies and runs their code, so it holds no write permission.
  # A compromised package can fail this job, but it cannot publish the site.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --engine-strict

      # Deliberately the full gate, not just the build. This duplicates ci.yml on
      # a push to main, which is cheap next to publishing a broken app: nothing
      # else stands between a bad commit and the live site.
      - name: Check
        run: npm run check

      # And the browser suite, for the same reason: the service worker, offline
      # launch and the security policy only fail in a real browser.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Without the update-banner projects (`*-update`). On this job, and only
      # here, the new service worker installs and then stays waiting, so the
      # banner never comes; CI runs the same test on the same browsers and it
      # passes, as it does locally. CI still gates it; see docs/current-state.md.
      - name: Browser tests
        run: npm run test:e2e -- --project=chromium --project=firefox --project=webkit

      # `tsc -b` runs inside this, and the checkout is a real git clone, so
      # vite.config.ts resolves the build commit on its own.
      #
      # `APP_MOVED_TO` is empty until the app has a new home. Once it is set, this
      # build tells learners where the app went (see "Switching hosts").
      - name: Build
        run: npm run build -w linguastein-app
        env:
          APP_MOVED_TO: ${{ vars.APP_MOVED_TO }}

      # Pages has no rewrite rule, so a hard refresh on /practice would 404.
      # Serving the app shell as the 404 body lets the router take over.
      - name: SPA fallback
        run: cp apps/linguastein/dist/index.html apps/linguastein/dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/linguastein/dist

      # The same app for Cloudflare: served from its own origin's root, with the
      # `_headers` file Pages cannot use. Off until `CLOUDFLARE_DEPLOY` is `true`.
      # Packaged with `wrangler.json`, so the deploy job needs no checkout.
      - name: Build for Cloudflare
        if: vars.CLOUDFLARE_DEPLOY == 'true'
        working-directory: apps/linguastein
        run: |
          npx vite build --outDir cloudflare/dist --emptyOutDir
          cp wrangler.json cloudflare/
        env:
          DEPLOY_TARGET: cloudflare
          APP_BASE_PATH: ${{ vars.CLOUDFLARE_BASE_PATH || '/' }}

      - if: vars.CLOUDFLARE_DEPLOY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare
          path: apps/linguastein/cloudflare
          if-no-files-found: error

  # Holds the publishing permissions, and runs no repository or package code.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Publishes to Cloudflare. Like `deploy`, it runs no repository or package
  # code: only a pinned Wrangler, in a directory holding nothing but the build.
  # Needs the `CLOUDFLARE_API_TOKEN` secret and `CLOUDFLARE_ACCOUNT_ID` variable.
  cloudflare:
    needs: build
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: cloudflare
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare

      - name: Deploy
        run: npx --yes wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          npm_config_ignore_scripts: 'true'
