<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <!--
      GitHub Pages cannot set response headers, so the crawler and training
      opt-outs live here and in public/robots.txt instead of in an `X-Robots-Tag`.
      Advisory either way: honoured only by crawlers that choose to.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Mobile-first Spanish practice: listen, repeat, reveal, review."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>%APP_NAME% — %APP_TAGLINE%</title>
    <script>
      // Resolve appearance before first paint, so neither colour nor type size
      // flashes. Four independent axes, each with its own cache key and its own
      // root attribute: theme (light/dark), palette (which hues), contrast (how
      // far apart they sit) and reading size. `%APP_ID%` is substituted from
      // src/app/identity.ts, so these keys cannot drift from the app identity.
      (function () {
        var root = document.documentElement;
        // Each axis falls back to its default rather than aborting the rest: a
        // single unreadable key must not leave the page unthemed.
        function pick(name, allowed, fallback) {
          try {
            var stored = localStorage.getItem('%APP_ID%.' + name);
            return allowed.indexOf(stored) >= 0 ? stored : fallback;
          } catch (error) {
            return fallback;
          }
        }
        var theme = pick('theme', ['system', 'dark', 'light'], 'system');
        var dark = theme === 'dark';
        if (theme === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (error) {
            dark = true;
          }
        }
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.palette = pick('palette', ['indigo', 'teal', 'plum', 'sand'], 'indigo');
        root.dataset.contrast = pick('contrast', ['soft', 'normal', 'more', 'max'], 'normal');
        root.dataset.readingSize = pick('reading-size', ['small', 'medium', 'large'], 'small');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
