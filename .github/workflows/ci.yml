name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this job runs every dependency's code and needs to write nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs; see deploy.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict so a dependency that outgrows .nvmrc fails here, by name, rather
      # than as every test worker crashing on an API the pinned Node lacks.
      - run: npm ci --engine-strict

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # With coverage, so the floors in vite.config.ts are enforced rather than
      # merely recorded. Same command `npm run check` runs locally.
      - name: Test
        run: npm run test:coverage

      - name: Validate datasets
        run: npm run validate:data

      # The whole tree, not just public/packs: the build also writes assigned
      # item ids back into content/es, so a row committed without one would
      # otherwise slip through unnoticed.
      #
      # The one step `npm run check` deliberately does not run: it needs a clean
      # working tree to read a diff against, and the gate is run mid-change with
      # a dirty one. Every other step here is in the gate.
      - name: Datasets match their sources
        run: |
          npm run build:data
          git diff --exit-code

      - name: Build
        run: npm run build

      # Genuinely last, and this is the second time the order has had to be
      # fixed to make that true.
      #
      # A failed step skips the ones after it. Formatting sat third once, and
      # fourteen commits reached main with it red and their tests and datasets
      # never checked by CI at all. Moving it to fifth of seven was called
      # "last" and was not: `Build` still sat behind it, and `Build` is the step
      # that caught a 2.65 MB dataset the service worker would have refused to
      # precache — a failure no amount of whitespace should be able to hide.
      - name: Format check
        run: npm run format:check

  # The production build in Chromium, Firefox and WebKit: service worker,
  # offline launch, updates, the content security policy and two-tab storage.
  # A separate job so a browser failure never hides the gate's result, or the
  # other way round. `npm run check` does not run it: it needs the browsers.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --engine-strict

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
